map_server:
  ros__parameters:
    frame_id: map
    topic_name: map

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.10
      use_final_approach_orientation: false

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.20
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.20
      stateful: false
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.20
      forward_sampling_distance: 0.25
      rotate_to_heading_angular_vel: 0.50
      max_angular_accel: 0.60
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      closed_loop: false
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      min_vel_x: 0.0
      max_vel_x: 0.30
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.30
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.40
      decel_lim_y: 0.0
      decel_lim_theta: -0.60
      limit_vel_cmd_in_traj: false
      vx_samples: 5
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.20
      linear_granularity: 0.04
      angular_granularity: 0.025
      transform_tolerance: 0.4
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathAlign, GoalAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.4
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.40,-0.22],[-0.40,0.22],[0.40,0.22],[0.40,-0.22]]'
      footprint_padding: 0.01
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.225
        cost_scaling_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.4
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[-0.40,-0.22],[-0.40,0.22],[0.40,0.22],[0.40,-0.22]]'
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        # nav_sensors already selects the calibrated height band above the local ground.
        # The coordinates tested by ObstacleLayer here are absolute odom heights.
        min_obstacle_height: -1000000.0
        max_obstacle_height: 1000000.0
        observation_sources: mid360
        mid360:
          topic: /navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          expected_update_rate: 1.0
          min_obstacle_height: -1000000.0
          max_obstacle_height: 1000000.0
          obstacle_min_range: 0.12
          obstacle_max_range: 2.5
          raytrace_min_range: 0.12
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.225
        cost_scaling_factor: 5.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.4
    bt_loop_duration: 10
    default_server_timeout: 100
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_wait_action_bt_node

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    footprint_topic: local_costmap/published_footprint
    costmap_topic: local_costmap/costmap_raw
    transform_tolerance: 0.4
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.30, 0.0, 0.50]
    min_velocity: [0.0, 0.0, -0.50]
    max_accel: [0.40, 0.0, 0.60]
    max_decel: [-0.40, 0.0, -0.60]
    odom_topic: /odom
    velocity_timeout: 0.35
